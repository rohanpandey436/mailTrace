[project]
name = "mailtrace-backend"
version = "1.0.0"
description = "AI-powered email threat detection, geolocation and forensic intelligence (SIH PS 26106)"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "C4",
    "SIM",
    "PIE",
    "ISC",
    "RUF",
]
ignore = [
    "E501",
    "RUF012",
    "SIM108",
    "B905",
    "UP035",
    "ISC004",
    "UP042",
    "BLE001",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "E402"]
"app/core/knowledge.py" = ["RUF001"]
"app/core/ai_engine.py" = ["RUF001"]
"app/core/parser.py" = ["RUF001"]
"app/ai/model_trainer.py" = ["F401"]
"app/ai/url_model.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["app"]

[[tool.mypy.overrides]]
module = "app.ai.transformer_trainer"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "app.ai.transformer"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "app.tasks"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "app.utils.pdf_generator"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore"]
