[project]
name = "mailtrace-backend"
version = "1.0.0"
description = "AI-powered email threat detection, geolocation and forensic intelligence (SIH PS 26106)"
requires-python = ">=3.13"

# --------------------------------------------------------------------------- #
# Linting.  `ruff check app tests` must pass; `ruff check --fix` applies the
# mechanical fixes.  BLE001 is enabled on purpose: a catch-everything except
# is allowed only at a fault-isolation boundary, and must say why on its line.
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # modern syntax for the targeted Python
    "B",        # bugbear
    "BLE",      # blind except
    "C4",       # comprehensions
    "SIM",      # simplifications
    "PIE",      # misc lints
    "ISC",      # implicit string concatenation
    "RUF",      # ruff's own rules, including unused-noqa
]
ignore = [
    "E501",     # line length: long f-strings and table literals are clearer unbroken
    "RUF012",   # mutable class attributes: pydantic models declare defaults this way
    "SIM108",   # ternaries are not always clearer than if/else
    "B905",     # zip(strict=) on every call adds noise where lengths are equal by construction
    "UP035",    # typing.Callable/Iterator are still the documented names in this codebase
    "ISC004",   # long messages are split across literals inside tuples on purpose
    "UP042",    # StrEnum would change str(ThreatCategory.X) and therefore report text
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are immutable by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
# The homoglyph table exists precisely to hold confusable characters.
"app/core/knowledge.py" = ["RUF001"]

# --------------------------------------------------------------------------- #
# Type checking.  `mypy app` must pass in strict mode.  The scientific and
# document libraries ship no type information, so their imports resolve to
# Any; every value that crosses from them is annotated at the boundary.
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["app"]

# transformers, optimum and datasets ship no type information, and this module
# is a development CLI rather than part of the service. Checking it would mean
# an ignore on nearly every line for no safety gained.
[[tool.mypy.overrides]]
module = "app.ai.transformer_trainer"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore"]
