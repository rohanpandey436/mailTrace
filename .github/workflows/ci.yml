name: CI

on:
  push:
  pull_request:

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ruff + mypy + import check + pytest (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          # 3.13 matches render.yaml's PYTHON_VERSION and the Dockerfile base.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests

      - name: Type-check
        # Strict mode; the configuration is in pyproject.toml.
        run: python -m mypy app

      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import app

          # "run" is the entry point script beside the package, not part of it.
          names = ["app"] + [m.name for m in pkgutil.walk_packages(app.__path__, "app.")] + ["run"]
          failures = []
          for name in names:
              try:
                  importlib.import_module(name)
              except Exception as exc:               # noqa: BLE001 - report them all, then fail
                  failures.append(f"{name}: {type(exc).__name__}: {exc}")

          print(f"imported {len(names) - len(failures)}/{len(names)} modules")
          for failure in failures:
              print(f"  FAIL {failure}")
          sys.exit(1 if failures else 0)
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Check the stylesheet is not stale
        # css/app.css is Tailwind's committed output; rebuild it and compare bytes.
        working-directory: .
        run: python frontend/build_css.py --check

  engine:
    name: C++20 engine linked against OpenSSL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install OpenSSL headers
        # Installed explicitly rather than relying on the runner image.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Build the engine, requiring OpenSSL
        # MAILTRACE_OPENSSL=1: an unusable OpenSSL fails the build instead of falling back.
        run: MAILTRACE_OPENSSL=1 pip install ./engine

      - name: Verify it really links libcrypto
        run: |
          python - <<'PY'
          import hashlib, os, mailtrace_engine as engine

          backend = engine.SHA256_BACKEND
          print(f"mailtrace_engine {engine.__version__}, SHA-256 backend: {backend}")
          assert backend == "openssl", f"expected the OpenSSL backend, got {backend!r}"

          vectors = [b"", b"abc", b"a" * 63, b"a" * 64, b"a" * 65]
          vectors += [os.urandom(n) for n in (55, 56, 57, 119, 120, 121, 4096)]
          for data in vectors:
              assert engine.sha256(data) == hashlib.sha256(data).hexdigest(), len(data)
          print(f"digests match hashlib on {len(vectors)} vectors")
          PY

      - name: Confirm the backend actually adopts it
        working-directory: backend
        # NATIVE_ENGINE is True only after the import-time self-check passes.
        run: |
          pip install -r requirements-dev.txt
          python -c "
          from app.core import parser
          status = parser.engine_status()
          print(status)
          assert status['native_engine'] is True, status
          assert status['native_engine_sha256'] == 'openssl', status
          "

      - name: Run the suite on the native path
        working-directory: backend
        run: python -m pytest -q

  queue:
    name: Celery worker against Redis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MAILTRACE_REDIS_URL: redis://127.0.0.1:6379/0
      # 0 embedded workers: a job can only complete via the worker started below.
      MAILTRACE_QUEUE_WORKERS: "0"
      # The worker reads the same variables, so both write to one database.
      MAILTRACE_DATA_DIR: ${{ github.workspace }}/queue-data
      MAILTRACE_ENABLE_NETWORK: "false"
      MAILTRACE_ORG_DOMAINS: acme-corp.in
      MAILTRACE_EXECUTIVES: "ceo,cfo,managing director,sarthak srivastava"
      MAILTRACE_ALERT_THRESHOLD: "70"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start a Celery worker
        # Backgrounded rather than a service container: it must run this checkout.
        run: |
          celery -A app.tasks worker --queues=mailtrace.analysis --concurrency=1 --loglevel=info > worker.log 2>&1 &
          echo $! > worker.pid
          for attempt in $(seq 1 30); do
            if grep -q "ready" worker.log; then
              echo "worker ready after ${attempt}s"
              exit 0
            fi
            if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
              echo "the worker exited during startup; log follows" >&2
              cat worker.log >&2
              exit 1
            fi
            sleep 1
          done
          echo "the worker never reported ready; log follows" >&2
          cat worker.log >&2
          exit 1

      - name: Run the queue tests
        run: python -m pytest tests/test_queue.py -q

      - name: Prove the worker did the work
        # Asserts where the work ran, so an in-process worker cannot quietly return.
        run: |
          grep -q "mailtrace.analyze_message" worker.log             || { echo "the worker never received a task; log follows" >&2; cat worker.log >&2; exit 1; }
          echo "tasks executed by the external worker:"
          grep -c "succeeded in" worker.log

      - name: Worker log
        if: always()
        run: cat worker.log || true

  docker:
    name: build and run the deployment image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f deploy/Dockerfile -t mailtrace:ci .

      - name: Run it and wait for the health check
        run: |
          docker run -d --name mailtrace -p 8000:8000             -e MAILTRACE_ENABLE_NETWORK=false mailtrace:ci
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health > health.json; then
              echo "healthy after ${attempt}s"
              cat health.json
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy; logs follow" >&2
          docker logs mailtrace >&2
          exit 1

      - name: Analyse a sample through the running container
        # Proves the image carries the frontend, samples and a working engine.
        run: |
          curl -fsS -F "files=@samples/phishing_sbi_kyc.eml"             http://127.0.0.1:8000/api/analyze -o result.json
          python -c "
          import json
          result = json.load(open('result.json'))['results'][0]
          verdict = result['verdict']
          print(f\"{verdict['category']} {verdict['risk_score']} in {result['processing_ms']} ms\")
          assert verdict['category'] == 'Phishing', verdict
          assert verdict['risk_score'] >= 70, verdict
          "
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"' && echo "dashboard served"

      - name: Confirm the image ships the OpenSSL-linked engine
        # Read from /api/health: what the running service reports about itself.
        run: |
          python -c "
          import json
          health = json.load(open('health.json'))
          print({k: health[k] for k in health if k.startswith('native_engine')})
          assert health['native_engine'] is True, health
          assert health['native_engine_sha256'] == 'openssl', health
          "

      - name: Container logs
        if: always()
        run: docker logs mailtrace || true
