# MailTrace continuous integration.
#
# Three jobs, each proving something the others deliberately do not.
#
# `test` runs WITHOUT the C++ engine and without the optional ML extras, so it
# proves the service is correct on the pure-Python path alone. It is offline by
# design (tests/conftest.py sets enable_network=False) and uses the bundled
# SQLite store, so there is nothing to stand up.
#
# `engine` compiles the C++20 extension against OpenSSL and runs the same suite
# WITH it, so both parsers are covered. The development machine has no OpenSSL
# headers, so this is the only place the linked build is exercised at all.
#
# `docker` builds and *runs* the deployment image, because a Dockerfile that has
# never been built is a claim rather than an artefact - and this project's
# development machine cannot run Docker (no hardware virtualisation).
name: CI

on:
  push:
  pull_request:

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ruff + mypy + import check + pytest (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        # Everything happens from backend/: pyproject.toml lives there and
        # tests/conftest.py resolves samples/ relative to it.
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          # 3.13 matches render.yaml's PYTHON_VERSION and the Dockerfile base.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt via "-r".  The optional
        # extras (requirements-ml.txt, requirements-pg.txt) are deliberately NOT
        # installed: CI must prove the service works without them.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        # Style, import order, modern syntax and - via BLE001 - the rule that a
        # catch-everything except is allowed only at a fault-isolation boundary.
        run: python -m ruff check app tests

      - name: Type-check
        # Strict mode; the configuration is in pyproject.toml.
        run: python -m mypy app

      - name: Import every module
        # Catches a syntax error, a circular import or a missing guard around an
        # optional dependency in a module no test happens to touch - the failure
        # mode that otherwise only shows up at startup in production.
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import app

          # "run" is the entry point script beside the package, not part of it.
          names = ["app"] + [m.name for m in pkgutil.walk_packages(app.__path__, "app.")] + ["run"]
          failures = []
          for name in names:
              try:
                  importlib.import_module(name)
              except Exception as exc:               # noqa: BLE001 - report them all, then fail
                  failures.append(f"{name}: {type(exc).__name__}: {exc}")

          print(f"imported {len(names) - len(failures)}/{len(names)} modules")
          for failure in failures:
              print(f"  FAIL {failure}")
          sys.exit(1 if failures else 0)
          PY

      - name: Run tests
        run: python -m pytest -q

  engine:
    name: C++20 engine linked against OpenSSL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install OpenSSL headers
        # Present on the GitHub runner image already; installed explicitly so
        # this job does not silently depend on what the image happens to ship.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Build the engine, requiring OpenSSL
        # MAILTRACE_OPENSSL=1 makes setup.py fail instead of falling back, so a
        # broken link surfaces here rather than as a quietly different build.
        run: MAILTRACE_OPENSSL=1 pip install ./engine

      - name: Verify it really links libcrypto
        run: |
          python - <<'PY'
          import hashlib, os, mailtrace_engine as engine

          backend = engine.SHA256_BACKEND
          print(f"mailtrace_engine {engine.__version__}, SHA-256 backend: {backend}")
          assert backend == "openssl", f"expected the OpenSSL backend, got {backend!r}"

          # Identical digests are the whole point: the deployment may run either
          # build, and a chain-of-custody ledger written by one must verify
          # under the other. Block boundaries are where a hash implementation
          # goes wrong, so they are all covered.
          vectors = [b"", b"abc", b"a" * 63, b"a" * 64, b"a" * 65]
          vectors += [os.urandom(n) for n in (55, 56, 57, 119, 120, 121, 4096)]
          for data in vectors:
              assert engine.sha256(data) == hashlib.sha256(data).hexdigest(), len(data)
          print(f"digests match hashlib on {len(vectors)} vectors")
          PY

      - name: Confirm the backend actually adopts it
        working-directory: backend
        # NATIVE_ENGINE is only True after the import-time self-check passes, so
        # this asserts the engine was accepted, not merely that it imported.
        run: |
          pip install -r requirements-dev.txt
          python -c "
          from app.core import parser
          status = parser.engine_status()
          print(status)
          assert status['native_engine'] is True, status
          assert status['native_engine_sha256'] == 'openssl', status
          "

      - name: Run the suite on the native path
        working-directory: backend
        run: python -m pytest -q

  docker:
    name: build and run the deployment image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # From the repository root, not deploy/: the image needs backend/,
        # frontend/ and samples/ together, exactly as deploy/Dockerfile says.
        run: docker build -f deploy/Dockerfile -t mailtrace:ci .

      - name: Run it and wait for the health check
        run: |
          docker run -d --name mailtrace -p 8000:8000             -e MAILTRACE_ENABLE_NETWORK=false mailtrace:ci
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health > health.json; then
              echo "healthy after ${attempt}s"
              cat health.json
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy; logs follow" >&2
          docker logs mailtrace >&2
          exit 1

      - name: Analyse a sample through the running container
        # Proves the image carries the frontend, the samples and a working
        # engine - not merely that it starts.
        run: |
          curl -fsS -F "files=@samples/phishing_sbi_kyc.eml"             http://127.0.0.1:8000/api/analyze -o result.json
          python -c "
          import json
          result = json.load(open('result.json'))['results'][0]
          verdict = result['verdict']
          print(f\"{verdict['category']} {verdict['risk_score']} in {result['processing_ms']} ms\")
          assert verdict['category'] == 'Phishing', verdict
          assert verdict['risk_score'] >= 70, verdict
          "
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"' && echo "dashboard served"

      - name: Confirm the image ships the OpenSSL-linked engine
        # Read from /api/health rather than from `docker exec`, so this checks
        # what the running service reports about itself - the same field a judge
        # or an auditor would look at.
        run: |
          python -c "
          import json
          health = json.load(open('health.json'))
          print({k: health[k] for k in health if k.startswith('native_engine')})
          assert health['native_engine'] is True, health
          assert health['native_engine_sha256'] == 'openssl', health
          "

      - name: Container logs
        if: always()
        run: docker logs mailtrace || true
