<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MailTrace — Email Threat Forensics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <!--
    One stylesheet, built by Tailwind from css/tailwind.css - which imports the
    design tokens, this project's reset and its component classes, and layers
    Tailwind's own preflight and utilities around them. Committed, so no
    toolchain is needed to serve the dashboard; `python frontend/build_css.py`
    rebuilds it and CI checks it is not stale.
  -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- React renders the whole application into this element; see js/main.js. -->
  <div id="root"></div>

  <!--
    UMD bundles rather than a bundler: with React, ReactDOM and htm as globals,
    js/ is a directory of ES modules the browser runs as written. That is what
    keeps the frontend a set of static files FastAPI serves directly, with no
    build step in CI and no Node on the deployment.
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
