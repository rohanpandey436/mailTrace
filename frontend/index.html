<script>
tailwind.config = {

    colors: {
      paper: '#F7F8FA', card: '#FFFFFF', line: '#E3E6EB', line2: '#EEF1F5',
      ink: '#1A2130', mut: '#697586', brand: '#D9480F', brandsoft: '#FFF4ED',
      ok: '#15803D', warn: '#B45309', bad: '#DC2626', info: '#1D4ED8', purple: '#6D28D9'

    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['ui-monospace', 'SFMono-Regular', 'Consolas', 'monospace'] }

<style>
  html { color-scheme: light; }
  body { background: #F7F8FA; color: #1A2130; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: #CDD3DC; border-radius: 8px; border: 3px solid #F7F8FA; }
  .card { background: #fff; border: 1px solid #E3E6EB; border-radius: 14px; }
  .chip { display: inline-flex; align-items: center; gap: .3rem; padding: .18rem .6rem; border-radius: 999px;
          font-size: .74rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
  .tab { padding: .5rem .85rem; border-radius: 9px; font-size: .86rem; color: #697586; font-weight: 500; }
  .tab:hover { color: #1A2130; background: #EEF1F5; }
  .tab.active { color: #1A2130; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.06), inset 0 0 0 1px #E3E6EB; }
  .nav-link { display: flex; align-items: center; gap: .6rem; padding: .55rem .8rem; border-radius: 10px;
              color: #697586; font-weight: 500; font-size: .9rem; }
  .nav-link:hover { color: #1A2130; background: #EEF1F5; }
  .nav-link.active { color: #1A2130; background: #fff; box-shadow: inset 0 0 0 1px #E3E6EB; }
  .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .9rem; border-radius: 10px;
         font-size: .85rem; font-weight: 600; border: 1px solid #E3E6EB; background: #fff; color: #1A2130;
         box-shadow: 0 1px 2px rgba(16,24,40,.04); transition: background .15s, border-color .15s; }
  .btn:hover { background: #F7F8FA; border-color: #CDD3DC; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: #D9480F; border-color: #D9480F; color: #fff; }
  .btn-primary:hover { background: #C03D0B; border-color: #C03D0B; }
  .input { background: #fff; border: 1px solid #E3E6EB; border-radius: 10px; padding: .5rem .75rem;
           font-size: .86rem; color: #1A2130; outline: none; }
  .input:focus { border-color: #D9480F; box-shadow: 0 0 0 3px rgba(217,72,15,.12); }
  .kv { display: grid; grid-template-columns: 10rem 1fr; gap: .4rem 1rem; font-size: .86rem; }
  .kv dt { color: #697586; } .kv dd { word-break: break-word; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .8rem; }
  .hint { font-size: .8rem; color: #697586; line-height: 1.55; }
  .dropzone { border: 2px dashed #CDD3DC; border-radius: 16px; background: #fff; transition: all .15s; }
  .dropzone.over { border-color: #D9480F; background: #FFF4ED; }
  .skeleton { background: linear-gradient(90deg, #F1F3F7 25%, #E8ECF2 50%, #F1F3F7 75%); background-size: 200% 100%;
              animation: sh 1.4s infinite; border-radius: 12px; }
  @keyframes sh { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
  #map { height: 400px; border-radius: 12px; background: #EEF1F5; }
  .leaflet-container { font-family: Inter, system-ui, sans-serif; }
  /* Mute the basemap so the markers and the rest of the page stay the focus. */
  .leaflet-tile-pane { filter: saturate(.45) brightness(1.04); }
  .hop { border-left: 3px solid #E3E6EB; }
  .hop.origin { border-left-color: #D9480F; background: #FFF9F5; }
  .hop.active { background: #EEF1F5; }
  .toast { background: #fff; border: 1px solid #E3E6EB; border-left: 4px solid #15803D; border-radius: 12px;
           padding: .8rem 1rem; box-shadow: 0 12px 28px rgba(16,24,40,.12); font-size: .86rem;
           min-width: 260px; max-width: 400px; animation: tin .2s ease-out; }
  .toast.error { border-left-color: #DC2626; } .toast.alert { border-left-color: #D9480F; }
  @keyframes tin { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
  .bar { height: 9px; border-radius: 999px; background: #EEF1F5; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 999px; }
  .switch { width: 40px; height: 22px; border-radius: 999px; background: #CDD3DC; position: relative;
            transition: background .15s; cursor: pointer; flex: none; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
                   border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
  .switch.on { background: #D9480F; } .switch.on::after { left: 21px; }
  table.grid { width: 100%; border-collapse: collapse; font-size: .85rem; }
  table.grid th { text-align: left; color: #697586; font-weight: 600; font-size: .72rem;
                  text-transform: uppercase; letter-spacing: .05em; padding: .65rem .75rem; border-bottom: 1px solid #E3E6EB; }
  table.grid td { padding: .65rem .75rem; border-bottom: 1px solid #EEF1F5; vertical-align: top; }
  table.grid tr.row:hover td { background: #F7F8FA; cursor: pointer; }
  #tooltip { position: fixed; z-index: 60; background: #fff; border: 1px solid #E3E6EB; border-radius: 10px;
             padding: .5rem .7rem; font-size: .76rem; pointer-events: none; max-width: 320px;
             box-shadow: 0 8px 20px rgba(16,24,40,.12); }
  .graph-svg text { font-size: 10px; pointer-events: none; }
  pre.body { white-space: pre-wrap; word-break: break-word; }
  details summary { cursor: pointer; list-style: none; } details summary::-webkit-details-marker { display: none; }
  .note { border-radius: 12px; padding: .85rem 1rem; font-size: .85rem; line-height: 1.55; }
  .note-warn { background: #FFFBEB; border: 1px solid #FDE68A; color: #78350F; }
  .note-info { background: #F0F6FF; border: 1px solid #C7DBFF; color: #1E3A8A; }
</style>
</head>
<body class="min-h-full font-sans">
<div class="flex min-h-screen">
  <nav id="rail" class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-line flex justify-around px-2 py-2
       md:static md:w-60 md:flex-col md:justify-start md:gap-1 md:border-t-0 md:border-r md:px-3 md:py-5 md:shrink-0">
    <a href="#/dashboard" class="hidden md:flex items-center gap-2 px-2 mb-6">
      <span class="w-9 h-9 rounded-xl bg-brand text-white font-bold flex items-center justify-center">M</span>
      <span><span class="font-semibold tracking-tight block leading-tight">MailTrace</span>
        <span class="text-[11px] text-mut">Email threat forensics</span></span>
    </a>
    <a class="nav-link" href="#/dashboard" data-route="dashboard"><span>🏠</span><span>Home</span></a>
    <a class="nav-link" href="#/cases" data-route="cases"><span>📥</span><span>Checked emails</span></a>
    <a class="nav-link" href="#/campaigns" data-route="campaigns"><span>🔗</span><span>Linked attacks</span></a>
    <a class="nav-link" href="#/alerts" data-route="alerts"><span>🔔</span><span>Alerts</span>
      <span id="nav-alert-count" class="hidden ml-auto chip bg-bad text-white"></span></a>
    <div class="hidden md:block mt-auto px-2 text-[11px] text-mut leading-relaxed">
      SIH PS 26106<br>AI email threat detection, geolocation &amp; forensics
    </div>
  </nav>

  <div class="flex-1 flex flex-col min-w-0 pb-20 md:pb-0">
    <header class="sticky top-0 z-30 bg-paper/90 backdrop-blur border-b border-line px-4 md:px-6 py-3 flex items-center gap-3">
      <form id="search-form" class="flex-1 max-w-xl">
        <input id="search" class="input w-full" placeholder="Search by subject, sender, IP address or domain…" autocomplete="off">
      </form>
      <div class="flex items-center gap-3 ml-auto">
        <span id="net-badge" class="chip bg-line2 text-mut">…</span>
        <label class="hidden sm:flex items-center gap-2 text-xs text-mut select-none cursor-pointer"
               title="Hides names, email addresses, phone numbers and ID numbers everywhere on screen">
          <span>Hide personal info</span>
          <span id="mask-switch" class="switch" role="switch" tabindex="0" aria-label="Hide personal information"></span>
        </label>
        <a href="#/alerts" id="bell" class="relative btn px-3" title="Alerts">🔔
          <span id="bell-count" class="hidden absolute -top-1.5 -right-1.5 chip bg-bad text-white"></span></a>
      </div>
    </header>
    <main id="view" class="flex-1 px-4 md:px-6 py-6 max-w-[1360px] w-full mx-auto"></main>
  </div>
</div>
<div id="toasts" class="fixed bottom-24 md:bottom-6 right-6 z-50 flex flex-col gap-2"></div>
<div id="tooltip" class="hidden"></div>
<input type="file" id="file-input" class="hidden" multiple>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- state
  const state = { mask: false, advanced: false, health: null, unread: 0, current: null, map: null, sim: null,
                  filters: { q: '', category: '', min_risk: 0, page: 0 }, tab: 'findings', custody: null };
  try { state.mask = localStorage.getItem('mailtrace.mask') === '1'; } catch (e) { }
  try { state.advanced = localStorage.getItem('mailtrace.adv') === '1'; } catch (e) { }

  // Plain-English names for everything the engine reports.
  const CAT = {
    'Legitimate':    { c: '#15803D', bg: '#ECFDF3', label: 'Looks genuine',   blurb: 'Nothing suspicious found.' },
    'Suspicious':    { c: '#B45309', bg: '#FFFAEB', label: 'Suspicious',      blurb: 'Some warning signs. Treat with care.' },
    'Impersonated':  { c: '#6D28D9', bg: '#F5F3FF', label: 'Pretending to be someone', blurb: 'Poses as a person, brand or department.' },
    'Phishing':      { c: '#DC2626', bg: '#FEF3F2', label: 'Phishing',        blurb: 'Trying to steal passwords or personal details.' },
    'Fraud-Related': { c: '#C2410C', bg: '#FFF4ED', label: 'Money fraud',     blurb: 'Trying to get money transferred or fees paid.' }
  };
  const SEV = {
    info:     { c: '#697586', bg: '#F1F3F7', label: 'info' },
    low:      { c: '#15803D', bg: '#ECFDF3', label: 'low' },
    medium:   { c: '#B45309', bg: '#FFFAEB', label: 'medium' },
    high:     { c: '#C2410C', bg: '#FFF4ED', label: 'high' },
    critical: { c: '#DC2626', bg: '#FEF3F2', label: 'critical' }
  };
  const SOURCE = {
    spoofed_domain: ['The real domain was faked', 'Someone forged a genuine company’s address (spoofed domain).'],
    lookalike_domain: ['A copycat domain was used', 'The attacker registered a similar-looking domain (lookalike domain).'],
    compromised_account: ['A real account was hijacked', 'The mail passed every sender check, so a genuine mailbox was most likely broken into (compromised account).'],
    direct_attacker_infrastructure: ['Sent from the attacker’s own setup', 'Came from a server or throwaway mailbox the attacker controls directly.'],
    legitimate_sender: ['Genuine sender', 'The sender is who they claim to be.'],
    undetermined: ['Not enough evidence', 'The signals are not strong enough to say where this came from.']
  };
  const MODULE_LABEL = { headers: 'Email headers', auth: 'Sender checks', urls: 'Links', attachments: 'Attachments',
                         nlp: 'Wording', domains: 'Domains', geoip: 'Location & network', intel: 'Threat intel', scoring: 'Scoring' };
  const BEC_LABEL = { payment_diversion: 'Payment redirected to a new bank account',
                      fake_invoice: 'Fake or pressured invoice',
                      credential_harvesting: 'Password / OTP harvesting',
                      executive_impersonation: 'Pretending to be a boss' };
  const ACTION_LABEL = { ingested: 'email received', analyzed: 'analysed', report_generated: 'report made',
                         exported: 'downloaded', viewed_unmasked: 'viewed in full',
                         quarantine_decision: 'marked for quarantine', block_decision: 'marked for blocking' };
  // Stage 6 quick-bar. These describe a decision recorded inside MailTrace,
  // never an action taken in a mail system - the wording says so on purpose.
  const DECISION = {
    open:        { label: 'No decision recorded', c: '#697586' },
    quarantined: { label: 'Marked for quarantine', c: '#B45309' },
    blocked:     { label: 'Marked for blocking',   c: '#DC2626' }
  };
  const ROLE_LABEL = { sender: 'the sender', reply_to: 'replies go here', return_path: 'return address',
                       url: 'linked site', message_id: 'message id' };
  const NODE_COLOR = { email: '#D9480F', address: '#0E7490', domain: '#6D28D9', ip: '#DC2626',
                       asn: '#697586', url: '#B45309', attachment: '#15803D', campaign: '#1A2130' };
  const NODE_LABEL = { email: 'this email', address: 'email address', domain: 'domain', ip: 'IP address',
                       asn: 'network owner', url: 'link', attachment: 'attachment', campaign: 'attack group' };

  // ---------------------------------------------------------------- helpers
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString(); }
  function fmtBytes(n) { if (n == null) return '—'; if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; }
  function pct(v) { return Math.round((v || 0) * 100) + '%'; }
  function short(s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function flag(cc) { if (!cc || cc.length !== 2) return ''; try { return String.fromCodePoint(...cc.toUpperCase().split('').map(c => 0x1F1E6 + c.charCodeAt(0) - 65)); } catch (e) { return ''; } }
  function catOf(c) { return CAT[c] || { c: '#697586', bg: '#F1F3F7', label: c || 'Unknown', blurb: '' }; }
  function sevOf(s) { return SEV[s] || SEV.info; }
  function decode(s) { try { return decodeURIComponent(s || ''); } catch (e) { return s || ''; } }
  function toast(msg, kind) {
    const el = document.createElement('div'); el.className = 'toast ' + (kind || ''); el.innerHTML = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, kind === 'alert' ? 9000 : 5200);
  }
  function withMask(p) { return p + (p.includes('?') ? '&' : '?') + 'mask=' + (state.mask ? 'true' : 'false'); }
  async function api(path, opts) {
    const res = await fetch(withMask(path), opts || {});
    const text = await res.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) { data = { error: text }; }
    if (!res.ok) throw new Error((data && data.error) ? (typeof data.error === 'string' ? data.error : JSON.stringify(data.error)) : (res.status + ' ' + res.statusText));
    return data;
  }

  // ---------------------------------------------------------------- pieces
  function badge(c) { const k = catOf(c); return `<span class="chip" style="color:${k.c};background:${k.bg};border-color:${k.c}22">${esc(k.label)}</span>`; }
  function sev(s) { const k = sevOf(s); return `<span class="chip" style="color:${k.c};background:${k.bg}">${esc(k.label)}</span>`; }
  function chip(t, color) { const c = color || '#697586'; return `<span class="chip" style="color:${c};background:${c}14;border-color:${c}22">${esc(t)}</span>`; }
  function pass(label, value, good, why) {
    const c = good === true ? '#15803D' : good === false ? '#DC2626' : '#697586';
    const mark = good === true ? '✓' : good === false ? '✕' : '–';
    return `<span class="chip" style="color:${c};background:${c}12;border-color:${c}22" title="${esc(why || '')}">${mark} ${esc(label)} <span class="opacity-60">${esc(value)}</span></span>`;
  }
  function riskBar(score, severity) {
    const c = sevOf(severity).c;
    return `<div class="flex items-center gap-2"><div class="bar w-16"><div style="width:${Math.max(0, Math.min(100, score))}%;background:${c}"></div></div><span class="mono font-semibold">${esc(score)}</span></div>`;
  }
  function gauge(score, severity) {
    const c = sevOf(severity).c, len = Math.PI * 80, on = len * Math.max(0, Math.min(100, score)) / 100;
    return `<svg viewBox="0 0 200 120" class="w-44 mx-auto"><path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#EEF1F5" stroke-width="14" stroke-linecap="round"/><path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${on} ${len}"/><text x="100" y="90" text-anchor="middle" fill="#1A2130" font-size="36" font-weight="700">${esc(score)}</text><text x="100" y="112" text-anchor="middle" fill="#697586" font-size="11">RISK OUT OF 100</text></svg>`;
  }
  function empty(title, hint) { return `<div class="card p-10 text-center"><div class="text-lg font-semibold mb-1">${esc(title)}</div><div class="hint max-w-md mx-auto">${hint || ''}</div></div>`; }
  function skeleton(n) { return Array.from({ length: n || 3 }, () => '<div class="skeleton h-24 mb-3"></div>').join(''); }
  function kv(pairs) { return `<dl class="kv">${pairs.map(p => `<dt>${esc(p[0])}</dt><dd>${p[1] == null || p[1] === '' ? '<span class="text-mut">—</span>' : p[1]}</dd>`).join('')}</dl>`; }
  function section(title, body, extra, note) {
    return `<section class="card p-5 mb-4"><div class="flex items-center justify-between gap-3 mb-1"><h3 class="font-semibold">${esc(title)}</h3>${extra || ''}</div>${note ? `<p class="hint mb-3">${esc(note)}</p>` : '<div class="mb-3"></div>'}${body}</section>`;
  }

  // ---------------------------------------------------------------- router
  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    const name = parts[0] || 'dashboard';
    $$('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.route === name));
    if (state.map) { try { state.map.remove(); } catch (e) { } state.map = null; }
    if (state.sim) { try { state.sim.stop(); } catch (e) { } state.sim = null; }
    const view = $('#view');
    const handlers = {
      dashboard: renderDashboard, cases: renderCases, alerts: renderAlerts,
      email: v => renderEmail(v, decode(parts[1])),
      campaigns: v => parts[1] ? renderCampaign(v, decode(parts[1])) : renderCampaigns(v)
    };
    Promise.resolve((handlers[name] || renderDashboard)(view))
      .catch(err => { view.innerHTML = empty('Could not load this page', esc(err.message)); });
  }
  window.addEventListener('hashchange', route);

  // ---------------------------------------------------------------- home
  async function renderDashboard(view) {
    view.innerHTML = `
      <h1 class="text-2xl font-semibold tracking-tight">Check an email</h1>
      <p class="hint mt-1 mb-5 max-w-3xl">Drop in a saved email and MailTrace reads its hidden headers to work out who really sent it,
        where in the world it came from, and whether it is trying to trick you.</p>
      <div id="dropzone" class="dropzone p-8 mb-4 text-center cursor-pointer">
        <div class="text-3xl mb-2">📩</div>
        <div class="font-semibold text-lg">Drop email files here, or click to choose</div>
        <div class="hint mt-1">You can drop several at once.</div>
        <div class="mt-4 flex items-center justify-center gap-2 flex-wrap">
          <button class="btn" id="paste-toggle" type="button">Or paste the email text</button>
          <button class="btn" id="help-toggle" type="button">How do I save an email?</button>
        </div>
        <div id="help-box" class="hidden mt-4 text-left max-w-2xl mx-auto note note-info">
          <b>You need the whole email, including its hidden headers.</b> Forwarding it to yourself will not work.
          <ul class="mt-2 space-y-1 list-disc pl-5">
            <li><b>Gmail:</b> open the email, click the ⋮ menu at top right, choose <i>Download message</i>. That saves a .eml file.</li>
            <li><b>Outlook app:</b> open the email, File, Save As, and pick <i>Outlook Message Format</i>.</li>
            <li><b>Outlook web:</b> ⋯ menu, <i>View</i>, <i>View message source</i>, then copy everything into the paste box.</li>
            <li><b>Apple Mail:</b> select the email, File, Save As, format <i>Raw Message Source</i>.</li>
          </ul>
        </div>
        <div id="paste-box" class="hidden mt-4 text-left">
          <textarea id="paste-text" class="input w-full h-48 mono" placeholder="Paste the whole message source here, starting from the lines that look like &quot;Received:&quot; and &quot;From:&quot;…"></textarea>
          <div class="mt-2 flex justify-end"><button class="btn btn-primary" id="paste-submit" type="button">Check this email</button></div>
        </div>
        <div id="upload-progress" class="hidden mt-4 text-sm font-medium text-brand"></div>
      </div>
      <div id="stats">${skeleton(1)}</div>
      <div class="grid lg:grid-cols-3 gap-4 mt-4"><div class="lg:col-span-2" id="recent">${skeleton(2)}</div><div id="side">${skeleton(2)}</div></div>`;
    bindUpload();
    const [stats, recent] = await Promise.all([api('/api/stats'), api('/api/emails?limit=8')]);
    const total = stats.total_emails || 0;
    $('#stats').innerHTML = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${kpi('Emails checked', total, '#1D4ED8')}${kpi('Dangerous ones', stats.high_risk, '#DC2626')}
      ${kpi('Linked attacks', stats.campaigns, '#6D28D9')}${kpi('Unread alerts', stats.alerts_open, '#D9480F')}</div>`;
    const cats = Object.entries(stats.by_category || {}).filter(c => c[1] > 0);
    const dist = total
      ? `<div class="flex h-3 rounded-full overflow-hidden bg-line2 mb-3">${cats.map(c => `<div title="${esc(catOf(c[0]).label)}: ${c[1]}" style="width:${c[1] / total * 100}%;background:${catOf(c[0]).c}"></div>`).join('')}</div>
         <div class="space-y-1.5">${cats.map(c => `<div class="flex items-center gap-2 text-sm"><span class="w-2.5 h-2.5 rounded-full" style="background:${catOf(c[0]).c}"></span><span class="flex-1">${esc(catOf(c[0]).label)}</span><b>${c[1]}</b></div>`).join('')}</div>`
      : '<div class="hint">Nothing checked yet.</div>';

      ? `<ul class="text-sm space-y-2">${stats.top_countries.map(c => `<li class="flex justify-between"><span>${esc(c.country)}</span><b>${c.count}</b></li>`).join('')}</ul>`

      section('What we found', dist, '', 'How the checked emails break down.') +

      ? casesTable(recent.items)
      : '<div class="hint">Nothing here yet. Drop an email above, or try the ready-made examples in the <span class="mono">samples</span> folder of the project.</div>',

  }
  function kpi(label, value, color) {
    return `<div class="card p-4"><div class="text-xs text-mut font-medium">${esc(label)}</div><div class="text-3xl font-semibold mt-1" style="color:${color}">${esc(value == null ? 0 : value)}</div></div>`;
  }

  function bindUpload() {
    const zone = $('#dropzone'), input = $('#file-input');
    if (!zone) return;
    zone.addEventListener('click', e => {
      if (e.target.closest('#paste-box') || e.target.closest('#help-box') || e.target.tagName === 'BUTTON') return;
      input.click();
    });
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });
    input.onchange = () => { if (input.files.length) uploadFiles(input.files); input.value = ''; };
    $('#paste-toggle').addEventListener('click', e => { e.stopPropagation(); $('#paste-box').classList.toggle('hidden'); $('#help-box').classList.add('hidden'); });
    $('#help-toggle').addEventListener('click', e => { e.stopPropagation(); $('#help-box').classList.toggle('hidden'); $('#paste-box').classList.add('hidden'); });
    $('#paste-submit').addEventListener('click', async e => {
      e.stopPropagation();
      const raw = $('#paste-text').value;
      if (!raw.trim()) { toast('Paste the email text first.', 'error'); return; }
      await runAnalysis(() => api('/api/analyze/raw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ raw: raw, filename: 'pasted.eml' }) }), 'the pasted email');
    });
  }
  async function uploadFiles(files) {
    const form = new FormData();
    Array.from(files).forEach(f => form.append('files', f, f.name));
    await runAnalysis(() => api('/api/analyze', { method: 'POST', body: form }), files.length + ' email' + (files.length > 1 ? 's' : ''));
  }
  async function runAnalysis(call, label) {
    const prog = $('#upload-progress');
    if (prog) { prog.classList.remove('hidden'); prog.textContent = 'Checking ' + label + '… this takes a few seconds when internet lookups are on.'; }
    try {
      const data = await call();
      const results = data.results || [];
      if (!results.length) { toast('Nothing came back.', 'error'); return; }
      const traceable = results.filter(r => r.headers.hops.length);
      if (!traceable.length) {
        toast('Checked, but this email had <b>no delivery headers</b>, so it could not be traced. See the note on the next screen.', 'alert');
      } else {
        toast('Done. Checked ' + results.length + ' email' + (results.length > 1 ? 's' : '') + '.');
      }
      location.hash = '#/email/' + encodeURIComponent(results[0].id);
    } catch (err) { toast('Could not check that: ' + esc(err.message), 'error'); }
    finally { if (prog) prog.classList.add('hidden'); }
  }

    async function load() {

  // ------------------------------------------------------- quick-bar (Stage 6)

  // the enforcing; MailTrace holds no mailbox credentials and never touches a

  function decisionBar(id, d) {
    const state_ = DECISION[d.status] || DECISION.open;
    const last = (d.history || [])[(d.history || []).length - 1];

          ${d.indicators.length} indicator${d.indicators.length === 1 ? '' : 's'} from this case so you can hand them to
          your mail gateway, firewall or SOC team. <b class="text-ink">MailTrace is not connected to your mail system</b>,
          so nothing here moves, deletes or blocks a message on its own.</p>
        ${last ? `<p class="hint mt-1">Last recorded by <b class="text-ink">${esc(last.actor)}</b> on ${fmtDate(last.timestamp)}.</p>` : ''}

      <div class="flex gap-2 flex-wrap">
        ${button('quarantine', 'Record “quarantine”', 'Writes a quarantine decision to the evidence log and sets this case to “marked for quarantine”. It does not quarantine the email in your mailbox.')}

      </div></div>`;

  function showTab() {
    const r = state.current; if (!r) return;
    const panel = $('#tabpanel');
    if (state.map) { try { state.map.remove(); } catch (e) { } state.map = null; }
    if (state.sim) { try { state.sim.stop(); } catch (e) { } state.sim = null; }
    switch (state.tab) {
      case 'trace': panel.innerHTML = traceTab(r); setTimeout(() => initMap(r), 0); break;
      case 'content': panel.innerHTML = contentTab(r); break;
      case 'links': panel.innerHTML = linksTab(r); break;
      case 'domains': panel.innerHTML = domainsTab(r); break;
      case 'graph':
        panel.innerHTML = section('Connections', `<div id="graph" class="w-full h-[480px] bg-paper rounded-xl border border-line"></div>${graphLegend()}`,
          '', 'Everything this email touches, drawn as a map. Useful for spotting the same server or address turning up in other attacks.');
        setTimeout(() => drawGraph($('#graph'), r.graph), 0); break;
      case 'custody':
        panel.innerHTML = skeleton(2);
        custodyTab(r).then(html => { panel.innerHTML = html; const b = $('#verify-btn'); if (b) b.onclick = verifyLedger; });

      default: panel.innerHTML = findingsTab(r);
    }

    const actions = (v.recommended_actions || []).length
      ? section('What you should do', `<ol class="text-sm space-y-2 list-decimal pl-5">${v.recommended_actions.map(a => `<li>${esc(a)}</li>`).join('')}</ol>`)
      : '';
    const findingsHtml = real.length
      ? `<div class="space-y-2">${real.map(f => `<details class="card px-4 py-3">
          <summary class="flex items-center gap-3">
            <span class="w-16 shrink-0">${sev(f.severity)}</span>
            <span class="font-medium flex-1">${esc(f.title)}</span>
            <span class="chip bg-line2 text-mut">${esc(MODULE_LABEL[f.module] || f.module)}</span>
            <span class="text-mut text-xs">▾</span></summary>
          <p class="mt-2 text-sm text-mut pl-[4.75rem]">${esc(f.detail)}</p></details>`).join('')}</div>`
      : `<div class="note note-info">No warning signs were found in this email.</div>`;
    return section('What we found', findingsHtml, `<span class="text-xs text-mut">${real.length} thing${real.length === 1 ? '' : 's'} worth knowing</span>`,
      'Click any row to read the detail. Worst first.') + why + actions +
      (notes.length ? `<details class="card p-4"><summary class="text-sm font-medium text-mut">Show ${notes.length} background note${notes.length === 1 ? '' : 's'} ▾</summary>
        <ul class="mt-3 space-y-2 text-sm">${notes.map(f => `<li><b>${esc(f.title)}</b><div class="hint">${esc(f.detail)}</div></li>`).join('')}</ul></details>` : '');
  }

  function traceTab(r) {
    const hops = r.headers.hops || [];
    const mapped = hops.filter(h => h.geo && h.geo.lat != null);
    const list = hops.length ? hops.map(hp => {
      const g = hp.geo, isOrigin = hp.index === r.headers.originating_hop_index;
      return `<div class="hop ${isOrigin ? 'origin' : ''} pl-4 py-3 pr-2 rounded-r-lg cursor-pointer" data-hop="${hp.index}">
        <div class="flex items-center gap-2 text-sm flex-wrap">
          <span class="mono text-mut">Step ${hp.index + 1}</span>
          ${isOrigin ? chip('STARTED HERE', '#D9480F') : ''}
          <b class="truncate">${esc(hp.from_host || hp.from_ip || 'unknown computer')}</b>
          ${hp.is_private_ip ? chip('inside a private network', '#697586') : ''}</div>
        <div class="hint mt-1 flex flex-wrap gap-x-3">
          <span class="mono">${esc(hp.from_ip) || 'no address'}</span><span>handed to ${esc(hp.by_host) || 'unknown'}</span>
          <span>${fmtDate(hp.timestamp)}</span>
          ${hp.delay_seconds != null ? `<span class="${hp.delay_seconds < 0 ? 'text-bad font-medium' : ''}">${hp.delay_seconds < 0 ? 'clock went backwards' : 'took ' + Math.round(hp.delay_seconds) + 's'}</span>` : ''}</div>
        ${g && (g.country || g.isp) ? `<div class="text-xs mt-1">${flag(g.country_code)} ${esc([g.city, g.country].filter(Boolean).join(', '))}${g.isp ? ' · ' + esc(g.isp) : ''}
          ${g.is_tor_exit ? ' ' + chip('Tor', '#DC2626') : ''}${(g.blacklists || []).length ? ' ' + chip('on a blocklist', '#DC2626') : ''}</div>` : ''}
      </div>`;
    }).join('') : '<div class="hint">This email carried no delivery record, so there is no path to show.</div>';

    let mapNote;
    if (mapped.length) mapNote = 'Pins follow the order on the left. The orange pin is where the email started.';
    else if (!hops.length) mapNote = 'Nothing to map: the email had no delivery headers.';
    else if (state.health && state.health.network === false) mapNote = 'No pins because internet lookups are switched off. Restart without MAILTRACE_ENABLE_NETWORK=false and check the email again.';
    else mapNote = 'No pins: every step used a private or unlisted address, so no location could be found.';

    return `<div class="grid lg:grid-cols-2 gap-4">
      <section class="card p-5"><h3 class="font-semibold mb-1">The journey this email took</h3>
        <p class="hint mb-3">Read top to bottom. Each step is one mail server passing it along. ${esc(r.headers.origin_reasoning || '')}</p>
        <div class="max-h-[400px] overflow-y-auto -mx-1 px-1">${list}</div></section>
      <section class="card p-5"><h3 class="font-semibold mb-1">On the map</h3>
        <p class="hint mb-3">${esc(mapNote)}</p><div id="map"></div></section></div>`;
  }
  function initMap(r) {
    const el = $('#map'); if (!el || typeof L === 'undefined') return;
    const hops = (r.headers.hops || []).filter(h => h.geo && h.geo.lat != null && h.geo.lon != null);
    const map = L.map(el, { zoomControl: true, scrollWheelZoom: false });
    state.map = map;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 18 }).addTo(map);
    if (!hops.length) { map.setView([22, 20], 2); setTimeout(() => map.invalidateSize(), 60); return; }
    const pts = hops.map(h => [h.geo.lat, h.geo.lon]);
    if (pts.length > 1) L.polyline(pts, { color: '#D9480F', weight: 2, dashArray: '6 6', opacity: .75 }).addTo(map);
    const markers = {};
    hops.forEach(h => {
      const origin = h.index === r.headers.originating_hop_index;
      const m = L.circleMarker([h.geo.lat, h.geo.lon], {
        radius: origin ? 10 : 7, color: '#fff', weight: 2,
        fillColor: origin ? '#D9480F' : '#1D4ED8', fillOpacity: .95
      }).addTo(map);
      m.bindPopup(`<div style="font-size:12px"><b>Step ${h.index + 1}${origin ? ' · started here' : ''}</b><br>${esc(h.from_ip)}<br>${esc([h.geo.city, h.geo.country].filter(Boolean).join(', '))}<br>${esc(h.geo.isp)}</div>`);
      m.on('click', () => highlightHop(h.index));
      markers[h.index] = m;
    });
    // One location would otherwise zoom to street level, which looks broken and
    // implies a precision IP geolocation does not have. Keep it country-scale.
    if (pts.length === 1) map.setView(pts[0], 5);
    else map.fitBounds(L.latLngBounds(pts).pad(0.35), { maxZoom: 8 });
    setTimeout(() => map.invalidateSize(), 60);
    $$('#tabpanel .hop[data-hop]').forEach(el2 => el2.addEventListener('click', () => {
      const i = +el2.dataset.hop; highlightHop(i);
      const m = markers[i]; if (m) { map.panTo(m.getLatLng()); m.openPopup(); }
    }));
  }
  function highlightHop(i) { $$('#tabpanel .hop[data-hop]').forEach(el => el.classList.toggle('active', +el.dataset.hop === i)); }

  function contentTab(r) {
    const n = r.nlp;

          <div class="hint mt-2">Spotted: ${(p.evidence || []).slice(0, 5).map(e => esc(e)).join(' · ') || '—'}</div></div>`).join('')
      : '<div class="hint">None of the common business-fraud patterns were found.</div>';
    const groups = [['Rushing you', n.urgency_phrases], ['Scaring you', n.threat_terms],

    return `<div class="grid lg:grid-cols-2 gap-4">
      ${section('Pressure tactics', `
        <div class="flex items-center gap-3 text-sm mb-4"><span class="w-32 text-mut">How rushed it feels</span>

          <div class="flex flex-wrap gap-1">${(g[1] || []).slice(0, 8).map(x => chip(x, '#6D28D9')).join('') || '<span class="hint">nothing</span>'}</div></div>`).join('')}</div>
        <div class="hint mt-3">${n.generic_greeting ? 'Opens with a generic greeting like &ldquo;Dear Customer&rdquo; instead of your name. ' : ''}${n.requests_reply_not_click ? 'Pushes you to reply by email rather than click a link, a classic fraud move. ' : ''}${esc(n.word_count)} words.</div>`,
        '', 'Scam emails almost always rush, scare or flatter you. Here is what this one does.')}
      ${section('Business fraud patterns', `<div class="space-y-2">${bec}</div>`, '',
        'The four scams the problem statement asks us to catch.')}
      ${section('What the trained model thinks', probs.length
        ? `<div class="space-y-2">${probs.map(p => `<div class="flex items-center gap-3 text-xs"><span class="w-36 text-mut">${esc(catOf(p[0]).label)}</span>
            <div class="bar flex-1"><div style="width:${p[1] * 100}%;background:${catOf(p[0]).c}"></div></div>
            <span class="mono w-10 text-right">${(p[1] * 100).toFixed(0)}%</span></div>`).join('')}</div>
           ${(n.shap_weights || []).length ? `<div class="mt-4">
             <div class="text-xs text-mut font-medium mb-2">Which words decided it (SHAP values)</div>
             <div class="space-y-1">${n.shap_weights.slice(0, 8).map(w => {
               const pos = w.weight >= 0, mag = Math.min(1, Math.abs(w.weight) / Math.max(0.01, Math.abs(n.shap_weights[0].weight)));
               return `<div class="flex items-center gap-2 text-xs"><span class="w-32 truncate mono" title="${esc(w.token)}">${esc(w.token)}</span>
                 <div class="flex-1 flex"><div class="w-1/2 flex justify-end"><div style="width:${pos ? 0 : mag * 100}%;height:8px;border-radius:99px 0 0 99px;background:#15803D"></div></div>
                 <div class="w-1/2"><div style="width:${pos ? mag * 100 : 0}%;height:8px;border-radius:0 99px 99px 0;background:#DC2626"></div></div></div>
                 <span class="mono w-14 text-right ${pos ? 'text-bad' : 'text-ok'}">${w.weight >= 0 ? '+' : ''}${w.weight.toFixed(3)}</span></div>`;
             }).join('')}</div>
             <p class="hint mt-2">Red pushes toward <b>${esc(catOf(n.ml_category).label)}</b>, green pushes away from it.</p></div>`
             : `<p class="hint mt-3">Words that pushed the decision: ${(n.ml_top_terms || []).slice(0, 6).map(t => chip(t, '#1D4ED8')).join(' ') || '—'}</p>`}
           ${(n.lime_weights || []).length ? `<div class="mt-4 pt-3 border-t border-line">
             <div class="text-xs text-mut font-medium mb-2">Second opinion (LIME) — how the answer changes when words are removed</div>
             <div class="flex flex-wrap gap-1">${n.lime_weights.slice(0, 8).map(w =>
               chip(`${w.token} ${w.weight >= 0 ? '+' : ''}${w.weight.toFixed(3)}`, w.weight >= 0 ? '#DC2626' : '#15803D')).join(' ')}</div>
             <p class="hint mt-2">SHAP reads the model&rsquo;s own weights. LIME instead rewrites this email many times with words taken out, watches what changes, and fits a simple local model to that — here it matches the real model with R&sup2; ${(n.lime_fidelity || 0).toFixed(2)}. Red pushed toward <b>${esc(catOf(n.ml_category).label)}</b>, green pushed away.</p></div>` : ''}`
        : '<div class="hint">The model was not available, so only the rule book was used.</div>', '',
        'A model trained on hundreds of example emails scores every category.')}
      ${section('The message itself', `<pre class="body mono text-xs text-mut bg-paper border border-line rounded-xl p-3 max-h-[380px] overflow-y-auto">${esc(r.email.text_body) || '(empty)'}</pre>`)}

  function linksTab(r) {
    const urls = r.urls.urls || [], atts = r.attachments.attachments || [];
    const urlTable = urls.length
      ? `<div class="overflow-x-auto"><table class="grid"><thead><tr><th>Danger</th><th>Where it really goes</th><th>Why it is a problem</th></tr></thead><tbody>

          <td class="text-xs text-mut">${(u.reasons || []).map(esc).join('; ') || 'nothing unusual'}</td></tr>`).join('')}
      </tbody></table></div>`
      : '<div class="hint">This email contains no links.</div>';
    const attTable = atts.length
      ? `<div class="overflow-x-auto"><table class="grid"><thead><tr><th>Danger</th><th>File</th><th>Size</th><th>Why it is a problem</th></tr></thead><tbody>
        ${atts.map(a => `<tr><td>${sev(a.risk)}</td>
          <td><div class="font-medium break-all">${esc(a.filename)}</div>
            <div class="flex gap-1 mt-1 flex-wrap">${a.double_extension ? chip('disguised file type', '#DC2626') : ''}${a.has_macros ? chip('contains macros', '#DC2626') : ''}${a.mime_mismatch ? chip('not what it claims to be', '#DC2626') : ''}</div>
            <div class="mono text-[10px] text-mut mt-1 break-all">${esc(a.sha256)}</div></td>
          <td class="text-xs">${fmtBytes(a.size)}
            <div class="text-mut mt-1" title="Shannon entropy in bits per byte. 8.0 is completely random, which means compressed, encrypted or packed.">
              randomness ${(a.shannon_entropy || 0).toFixed(2)}/8${a.high_entropy ? ' <span class="text-bad font-semibold">high</span>' : ''}</div></td>
          <td class="text-xs text-mut">${(a.reasons || []).map(esc).join('; ') || 'nothing unusual'}</td></tr>`).join('')}
      </tbody></table></div>`
      : '<div class="hint">This email has no attachments.</div>';
    return section('Links in this email', urlTable, '', 'We follow what the link actually does, not what it says on screen.')
         + section('Attached files', attTable, '', 'We look inside the file, not just at its name.');
  }

  function domainsTab(r) {
    const inf = r.infrastructure, g = inf.origin_geo;
    const ipHtml = r.headers.originating_ip ? `<span class="mono font-semibold">${esc(r.headers.originating_ip)}</span>` : '';
    const where = section('The computer that sent it', kv([
      ['IP address', ipHtml],
      ['Location', g && g.country ? `${flag(g.country_code)} ${esc([g.city, g.region, g.country].filter(Boolean).join(', '))}` : ''],
      ['Who owns it', g ? esc([g.isp, g.org].filter(Boolean).join(' / ')) : ''],
      ['Network (ASN)', g ? esc(g.asn) : ''],
      ['Reputation', [inf.blacklisted ? chip('on a spam blocklist', '#DC2626') : '', inf.tor_exit ? chip('Tor exit node', '#DC2626') : '',
                      inf.vpn_or_proxy ? chip('VPN / proxy', '#B45309') : '', inf.hosting_provider ? chip('rented server', '#B45309') : '',
                      (!inf.blacklisted && !inf.tor_exit && !inf.vpn_or_proxy && !inf.hosting_provider) ? chip('nothing known against it', '#15803D') : ''].join(' ')]
    ]), '', 'Tracing the first real computer in the delivery path.');

        <div class="flex items-center justify-between mb-2 gap-2"><b class="mono break-all">${esc(d.domain)}</b>${chip(ROLE_LABEL[d.role] || d.role, '#0E7490')}</div>
        ${kv([
          ['How old', d.age_days != null ? (d.age_days < 90 ? `<b style="color:#DC2626">${d.age_days} days — brand new</b>` : d.age_days + ' days') : (d.source === 'offline' ? 'not checked (offline)' : 'unknown')],
          ['Registered with', esc(d.registrar)],
          ['Can receive mail', d.source === 'offline' ? '' : (d.has_mx ? 'yes' : 'no — unusual for a real company')],
          ['Copycat of', d.lookalike_of ? `<span style="color:#DC2626" class="font-medium">${esc(d.lookalike_of)} (${esc(d.lookalike_technique)})</span>` : ''],
          ['Notes', [d.is_free_mail ? chip('free mailbox (Gmail etc.)', '#697586') : '', d.is_disposable ? chip('throwaway address', '#DC2626') : '',
                     ...(d.reputation || []).map(t => chip(t, '#DC2626'))].join(' ')]
        ])}</div>`).join('')
      : '<div class="hint">No domains were checked.</div>';

  // ---------------------------------------------------------------- graph
  function graphLegend() {
    return `<div class="flex flex-wrap gap-3 mt-3 hint">${Object.keys(NODE_COLOR).map(k =>
      `<span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${NODE_COLOR[k]}"></span>${esc(NODE_LABEL[k] || k)}</span>`).join('')}
      <span class="ml-auto">Bigger circle = more dangerous. Drag anything to move it.</span></div>`;
  }
  function drawGraph(container, graph) {
    if (!container || typeof d3 === 'undefined') return;
    const nodes = (graph && graph.nodes ? graph.nodes : []).map(n => Object.assign({}, n));
    const ids = new Set(nodes.map(n => n.id));
    const links = (graph && graph.edges ? graph.edges : []).filter(e => ids.has(e.source) && ids.has(e.target))
      .map(e => ({ source: e.source, target: e.target, relation: e.relation }));
    container.innerHTML = '';
    if (!nodes.length) { container.innerHTML = '<div class="p-6 hint">Nothing to draw for this email.</div>'; return; }
    const w = container.clientWidth || 800, hgt = container.clientHeight || 480;
    const svg = d3.select(container).append('svg').attr('class', 'graph-svg')
      .attr('viewBox', [0, 0, w, hgt]).attr('width', '100%').attr('height', '100%');
    const g = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.3, 4]).on('zoom', ev => g.attr('transform', ev.transform)));
    const radius = n => ({ info: 7, low: 8, medium: 10, high: 12, critical: 14 })[n.risk] || 7;
    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(80))
      .force('charge', d3.forceManyBody().strength(-260))
      .force('center', d3.forceCenter(w / 2, hgt / 2))
      .force('collide', d3.forceCollide().radius(d => radius(d) + 16));
    state.sim = sim;
    const link = g.append('g').selectAll('line').data(links).join('line').attr('stroke', '#CDD3DC').attr('stroke-width', 1.3);
    const tip = $('#tooltip');
    const node = g.append('g').selectAll('circle').data(nodes).join('circle')
      .attr('r', radius).attr('fill', d => NODE_COLOR[d.type] || '#697586')
      .attr('stroke', '#fff').attr('stroke-width', 2)
      .on('mouseover', (ev, d) => { tip.innerHTML = `<b>${esc(d.label)}</b><div style="color:#697586">${esc(NODE_LABEL[d.type] || d.type)} · danger: ${esc(d.risk)}</div>`; tip.classList.remove('hidden'); })
      .on('mousemove', ev => { tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 14) + 'px'; })
      .on('mouseout', () => tip.classList.add('hidden'))
      .call(d3.drag()
        .on('start', (ev, d) => { if (!ev.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
        .on('end', (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    const label = g.append('g').selectAll('text').data(nodes).join('text')
      .text(d => short(d.label, 26)).attr('dx', d => radius(d) + 5).attr('dy', 4).attr('fill', '#4A5568');
    sim.on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('cx', d => d.x).attr('cy', d => d.y);
      label.attr('x', d => d.x).attr('y', d => d.y);
    });
  }

  // ---------------------------------------------------------------- campaigns
  async function renderCampaigns(view) {
    view.innerHTML = `<h1 class="text-2xl font-semibold tracking-tight">Linked attacks</h1>
      <p class="hint mt-1 mb-5 max-w-3xl">When two emails share the same sending computer, sender, link or attachment, they were almost
        certainly sent by the same person. MailTrace groups them automatically so you can see the whole campaign instead of one email at a time.</p>
      <div id="campaigns">${skeleton(2)}</div>`;
    const list = await api('/api/campaigns');
    $('#campaigns').innerHTML = list.length
      ? `<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${list.map(c => `<a class="card p-5 block hover:border-brand transition" href="#/campaigns/${esc(c.id)}">
          <div class="flex items-center justify-between mb-2 gap-2"><b class="truncate">${esc(c.name)}</b>${riskBar(c.max_risk, c.max_risk >= 75 ? 'critical' : c.max_risk >= 50 ? 'high' : c.max_risk >= 25 ? 'medium' : 'low')}</div>
          <div class="hint mb-3">${c.email_ids.length} emails · last seen ${fmtDate(c.updated_at)}</div>
          <div class="flex flex-wrap gap-1">${Object.keys(c.categories || {}).map(k => badge(k)).join('')}</div>
          <div class="hint mt-2">${(c.countries || []).map(esc).join(', ') || 'no locations'}</div></a>`).join('')}</div>`
      : empty('No linked attacks yet', 'A group appears automatically once two checked emails share something strong, such as the same sending computer or the same link.');
  }
  async function renderCampaign(view, id) {
    view.innerHTML = skeleton(3);
    const data = await api('/api/campaigns/' + encodeURIComponent(id));
    const c = data.campaign;
    view.innerHTML = `<a href="#/campaigns" class="text-sm text-mut">← Back to linked attacks</a>
      <h1 class="text-2xl font-semibold tracking-tight mt-2">${esc(c.name)}</h1>
      <p class="hint mt-1 mb-5">${c.email_ids.length} emails linked together · worst risk ${c.max_risk} · first seen ${fmtDate(c.created_at)}</p>
      ${section('What links them', `<div class="flex flex-wrap gap-1.5">${(c.indicators || []).map(i => `<span class="chip bg-line2 text-mut mono">${esc(i)}</span>`).join('') || '<span class="hint">—</span>'}</div>`,
        '', 'These exact things appear in more than one of the emails below.')}
      ${section('The emails', casesTable(data.emails || []))}
      ${section('All of it on one map', `<div id="graph" class="w-full h-[520px] bg-paper rounded-xl border border-line"></div>${graphLegend()}`,
        '', 'Every email in this group drawn together. Circles sitting between two emails are the shared pieces of the attacker’s setup, which is exactly what an investigator follows.')}`;
    setTimeout(() => drawGraph($('#graph'), data.graph), 0);
  }

  // ---------------------------------------------------------------- alerts
  function alertRow(a) {
    return `<div class="card p-4 flex items-center gap-4" data-alert="${esc(a.id)}">
      <div>${riskBar(a.risk_score, a.severity)}</div>
      <div class="flex-1 min-w-0"><div class="flex items-center gap-2">${badge(a.category)}
        <a class="font-medium truncate" href="#/email/${esc(a.email_id)}">${esc(a.subject) || '(no subject)'}</a></div>
        <div class="hint truncate mt-1">${esc(a.sender)} · ${fmtDate(a.created_at)}</div></div>
      ${a.acknowledged ? chip('seen', '#697586') : `<button class="btn ack-btn" data-id="${esc(a.id)}">Mark as seen</button>`}</div>`;
  }
  async function renderAlerts(view) {
    view.innerHTML = `<h1 class="text-2xl font-semibold tracking-tight">Alerts</h1>
      <p class="hint mt-1 mb-5">Raised the moment a dangerous email is checked, so nobody has to be watching the screen.</p>
      <div id="alerts" class="space-y-2">${skeleton(3)}</div>`;
    const list = await api('/api/alerts?limit=100');
    $('#alerts').innerHTML = list.length ? list.map(alertRow).join('')
      : empty('No alerts', 'Anything scoring above the alert level will show up here straight away.');
    state.unread = 0; updateBell();
  }
  document.addEventListener('click', async e => {
    const btn = e.target.closest('.ack-btn'); if (!btn) return;
    btn.disabled = true;
    try { await api('/api/alerts/' + encodeURIComponent(btn.dataset.id) + '/ack', { method: 'POST' }); btn.outerHTML = chip('seen', '#697586'); refreshAlertCount(); }
    catch (err) { btn.disabled = false; toast('Could not update: ' + esc(err.message), 'error'); }
  });
  function updateBell() {
    ['#bell-count', '#nav-alert-count'].forEach(sel => {
      const el = $(sel); if (!el) return;
      el.textContent = state.unread; el.classList.toggle('hidden', state.unread <= 0);
    });
  }
  async function refreshAlertCount() {
    try { state.unread = (await api('/api/alerts?unacknowledged_only=true&limit=100')).length; updateBell(); } catch (e) { }
  }
  // One handler for both live transports below.
  function onAlert(a) {
    if (!a || !a.id || !a.email_id) return;   // ignore anything that is not an Alert
    state.unread += 1; updateBell();
    toast(`<b>${esc(catOf(a.category).label)}</b> · risk ${esc(a.risk_score)}<br><a class="text-brand font-medium" href="#/email/${esc(a.email_id)}">${esc(short(a.subject, 60)) || 'Open it'}</a>`, 'alert');
    const box = $('#alerts');
    if (box && location.hash.startsWith('#/alerts')) {
      const e0 = box.querySelector('.card.p-10'); if (e0) e0.remove();
      box.insertAdjacentHTML('afterbegin', alertRow(a));
    }
  }

  // Live alerts. The WebSocket at /api/alerts/ws is preferred: it survives
  // proxies that buffer text/event-stream and does not count against the
  // browser's per-origin limit on SSE connections. If the handshake fails, or
  // the socket closes later, /api/alerts/stream takes over. Both endpoints are
  // fed by the same server-side broadcaster and carry identical Alert JSON, so
  // exactly one of them needs to be connected and it does not matter which.
  function liveFeed() {
    const query = state.mask ? '?mask=true' : '';
    let usingSse = false;

    function startSse() {
      if (usingSse) return; usingSse = true;
      if (!window.EventSource) return;
      let es; try { es = new EventSource('/api/alerts/stream' + query); } catch (e) { return; }
      es.addEventListener('alert', ev => { try { onAlert(JSON.parse(ev.data)); } catch (e) { } });
    }

    if (!window.WebSocket) { startSse(); return; }
    let ws, open = false;
    try {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/alerts/ws' + query);
    } catch (e) { startSse(); return; }
    ws.onopen = () => { open = true; };
    ws.onmessage = ev => { try { onAlert(JSON.parse(ev.data)); } catch (e) { } };
    ws.onclose = () => { startSse(); };          // never opened, or dropped later
    ws.onerror = () => { if (!open) { try { ws.close(); } catch (e) { } } };
    // Some proxies accept the upgrade and then never complete it; give up and
    // fall back rather than leaving the dashboard with no live feed at all.
    setTimeout(() => {
      if (!open && ws.readyState !== 1) { try { ws.close(); } catch (e) { } startSse(); }
    }, 5000);
  }

  // ---------------------------------------------------------------- boot
  function renderMask() { const s = $('#mask-switch'); s.classList.toggle('on', state.mask); s.setAttribute('aria-checked', state.mask ? 'true' : 'false'); }
  function toggleMask() {
    state.mask = !state.mask;
    try { localStorage.setItem('mailtrace.mask', state.mask ? '1' : '0'); } catch (e) { }
    renderMask(); state.custody = null;
    toast(state.mask ? 'Personal details are now hidden everywhere.' : 'Personal details are shown again.');
    route();
  }
  $('#mask-switch').addEventListener('click', toggleMask);
  $('#mask-switch').addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleMask(); } });

  async function loadHealth() {
    try {
      const h = await api('/api/health'); state.health = h;
      const badge = $('#net-badge');
      badge.innerHTML = h.network
        ? '<span class="w-1.5 h-1.5 rounded-full bg-ok inline-block mr-1"></span>Internet lookups on'
        : '<span class="w-1.5 h-1.5 rounded-full bg-warn inline-block mr-1"></span>Offline mode';
      badge.title = h.network ? 'Location, domain age and blocklist checks are working' : 'No location or domain-age data will be collected';
    } catch (e) { $('#net-badge').textContent = 'Server not reachable'; }
  }

  renderMask();
  loadHealth().then(() => { route(); refreshAlertCount(); liveFeed(); });
})();
</script>
</body>
</html>
