
name: mailtrace

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mailtrace:compose
    ports:
      - "8000:8000"
    environment:
      MAILTRACE_REDIS_URL: redis://redis:6379/0
      # 0 = enqueue only; the worker service does the analysis.
      MAILTRACE_QUEUE_WORKERS: "0"
      MAILTRACE_ENABLE_NETWORK: "false"
    volumes:
      - mailtrace-data:/app/backend/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    # The same image, started as a Celery worker.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mailtrace:compose
    command:
      - celery
      - -A
      - app.tasks
      - worker
      - --queues=mailtrace.analysis
      - --loglevel=info
      # Analysis is CPU-bound; scale the service rather than the concurrency.
      - --concurrency=1
    environment:
      MAILTRACE_REDIS_URL: redis://redis:6379/0
      MAILTRACE_ENABLE_NETWORK: "false"
    volumes:
      - mailtrace-data:/app/backend/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mailtrace-data:
